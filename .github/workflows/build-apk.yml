name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext virtualenv

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Fix Android SDK Symlink & Accept Licenses
        run: |
          # SDK ထဲတွင် Buildozer လိုအပ်သော tools/bin လမ်းကြောင်း ဖန်တီးခြင်း
          sudo mkdir -p $ANDROID_HOME/tools
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/tools/bin

          # Buildozer ထဲသို့ Android SDK ချိတ်ဆက်ခြင်း
          mkdir -p ~/.buildozer/android/platform
          ln -sf $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

          # License များကို အလိုအလျောက် လက်ခံခြင်း
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # buildozer.spec ထဲတွင် Auto Accept ပြင်ခြင်း
          if [ -f buildozer.spec ]; then
            sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma-debug-apk
          path: bin/*.apk
