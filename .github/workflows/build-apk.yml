name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space & Add Swap (Fix Memory Limit)
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libltdl-dev autoconf-archive \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev autopoint gettext virtualenv curl m4 \
            build-essential gfortran

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Android SDK & Force Single Architecture
        run: |
          # 1. SDK Folder လမ်းကြောင်းများ ဖန်တီးခြင်း
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools

          # 2. Android Cmdline Tools ဒေါင်းလုဒ်ဆွဲခြင်း
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          rm cmdline.zip

          # 3. Symlink ချိတ်ဆက်ခြင်း
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools

          # 4. License လက်ခံခြင်း
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

          # 5. buildozer.spec ထဲတွင် Single Arch (arm64-v8a) သို့ အတင်းပြောင်းခြင်း
          if [ -f buildozer.spec ]; then
            sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
            sed -i 's/^#\?\s*android.archs\s*=.*/android.archs = arm64-v8a/' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma-debug-apk
          path: bin/*.apk
