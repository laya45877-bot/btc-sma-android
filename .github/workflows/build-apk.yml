name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # Checkout source code
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------
      # Setup Java 17
      # -----------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # Install Android/Buildozer dependencies
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libtool-bin \
            gettext \
            autopoint \
            python3-pip \
            python3-venv \
            libstdc++6:i386 \
            libgcc-s1:i386 \
            zlib1g:i386 \
            libncurses5:i386

      # -----------------------------
      # Install Buildozer
      # -----------------------------
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

      # -----------------------------
      # Build Android APK
      # -----------------------------
      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma-debug-apk
          path: bin/*.apk
          if-no-files-found: error
