name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext virtualenv wget

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Complete Android SDK & Accept Licenses
        run: |
          # SDK လမ်းကြောင်းများ ဖန်တီးခြင်း
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools

          # 1. Legacy SDK Tools အပြည့်အစုံ (tools/lib အပါအဝင်) ဒေါင်းလုဒ်ဆွဲခြင်း
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4393082.zip -O sdk-tools.zip
          unzip -q sdk-tools.zip -d ~/.buildozer/android/platform/android-sdk/
          rm sdk-tools.zip

          # 2. Modern Cmdline Tools ဒေါင်းလုဒ်ဆွဲခြင်း
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          rm cmdline.zip

          # 3. License များကို အလိုအလျောက် လက်ခံခြင်း
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

          # 4. buildozer.spec ထဲတွင် Auto Accept သတ်မှတ်ခြင်း
          if [ -f buildozer.spec ]; then
            sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma-debug-apk
          path: bin/*.apk
